name: Privacy baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web application checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, type-check and build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  documentation:
    name: Documentation and plan gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate numbered privacy gates
        run: node scripts/verify-build-plan.mjs
      - name: Start isolated Supabase test stack
        run: npx --yes supabase@2.120.0 start --exclude studio,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Apply migrations and run database access tests
        run: |
          npx --yes supabase@2.120.0 db reset
          npx --yes supabase@2.120.0 test db --local
          npx --yes supabase@2.120.0 db lint --local --fail-on error
          npx --yes supabase@2.120.0 db advisors --local --type security --fail-on error
          npx --yes supabase@2.120.0 status --output env > "$RUNNER_TEMP/cadence-local-supabase.env"
          set -a
          source "$RUNNER_TEMP/cadence-local-supabase.env"
          set +a
          bash scripts/test-data-api-boundary.sh
          bash scripts/test-transaction-context.sh
      - name: Check whitespace errors
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$GITHUB_BASE_REF...HEAD"
          else
            git diff --check "HEAD^...HEAD"
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified Gitleaks CLI
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan full Git history for secrets
        run: gitleaks git --redact=100 --verbose .
